<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Focus TDAH</title>
<meta name="description" content="Asistente personal para TDAH: próxima tarea, foco, medicación, hábitos y patrones.">
<meta name="theme-color" content="#ECEFF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: una sola columna de teléfono, una acción dominante por pantalla, cuatro pestañas abajo. Superficies planas, sin ruido. */
:root{
  --bg:#ECEFF3; --surface:#FFFFFF; --soft:#F5F7FA; --ink:#16202B; --muted:#5A6774; --line:#D6DCE3;
  --accent:#2A55C4; --accent-ink:#FFFFFF; --accent-soft:#DFE7F8;
  --good:#2B7F52; --good-soft:#DDF0E5; --warn:#9A6411; --warn-soft:#F7EBD3; --crit:#B3392F; --crit-soft:#F6DFDC;
  --scrim:rgba(14,20,28,.42);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --surface:#182029; --soft:#131A21; --ink:#E6EBF0; --muted:#98A4B1; --line:#28323D;
  --accent:#8AA8FF; --accent-ink:#0D1424; --accent-soft:#1D2944;
  --good:#63C690; --good-soft:#16302A; --warn:#E2B254; --warn-soft:#33291A; --crit:#F08077; --crit-soft:#3A1F1E;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --surface:#182029; --soft:#131A21; --ink:#E6EBF0; --muted:#98A4B1; --line:#28323D;
  --accent:#8AA8FF; --accent-ink:#0D1424; --accent-soft:#1D2944;
  --good:#63C690; --good-soft:#16302A; --warn:#E2B254; --warn-soft:#33291A; --crit:#F08077; --crit-soft:#3A1F1E;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:18px 112px;display:flex;flex-direction:column;gap:16px}

/* type */
.eyebrow{font:700 12px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font:700 30px/1.12 var(--f-display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font:700 20px/1.2 var(--f-display);margin:0;text-wrap:balance}
.h3{font:700 16px/1.3 var(--f-body);margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
p{margin:0}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top .date{font:500 15px/1.3 var(--f-body);color:var(--muted);margin-top:4px}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:transparent;border-style:dashed}
.now{padding:22px 20px;gap:14px;border:0;box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(20,40,80,.35)}
.now .h1{font-size:31px}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;color:var(--muted);font-size:14.5px}
.block{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-sm);background:var(--soft);font-size:15px}
.block b{font-family:var(--f-mono);font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:700;letter-spacing:.02em;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.plain{background:var(--soft);color:var(--muted)}

/* status rows on AHORA */
.status{display:grid;grid-template-columns:1fr;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.srow{display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;width:100%;min-width:0}
.srow+.srow{border-top:1px solid var(--line)}
.srow .lbl{font-size:13px;color:var(--muted)}
.srow .val{font-weight:700;font-size:16px}
.srow .grow{flex:1;min-width:0}
.srow .chev{color:var(--muted);flex:none}
.meter10{display:flex;gap:3px;margin-top:6px}
.meter10 i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.meter10 i.on{background:var(--accent)}
.meter10.low i.on{background:var(--warn)}
.meter10.good i.on{background:var(--good)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--good)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.big{min-height:66px;font-size:20px;border-radius:18px;font-family:var(--f-display)}
.btn.soft{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--crit)}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row>.btn{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.linkbtn{color:var(--accent);font-weight:700;font-size:14.5px}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line);text-align:left;width:100%;min-width:0}
.item:first-child{border-top:0}
.item .t{font-weight:700;font-size:15.5px;line-height:1.3}
.item .s{font-size:13px;color:var(--muted)}
.item .grow{flex:1;min-width:0}
.time{font-family:var(--f-mono);font-size:13.5px;color:var(--muted);width:46px;flex:none;font-variant-numeric:tabular-nums}
.star{color:var(--accent);font-size:13px;font-weight:700}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:16px;height:16px}
details>summary{cursor:pointer;list-style:none;font-weight:700;color:var(--muted);font-size:14px;padding:4px 0}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"▸ ";}
details[open]>summary::before{content:"▾ ";}

/* load bar */
.bar{height:10px;border-radius:5px;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.over>i{background:var(--warn)}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--ink);font-size:14.5px;align-items:flex-start}
.note.info{background:var(--accent-soft)}
.note.good{background:var(--good-soft)}

/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lab{font-size:13.5px;font-weight:700;color:var(--muted)}
.input,textarea.input,select.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--soft);font-size:16px;min-width:0}
textarea.input{min-height:150px;resize:vertical;line-height:1.5}
.addform{display:flex;gap:8px}
.addform .input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:700}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.seg button{height:38px;border-radius:9px;background:var(--soft);border:1px solid var(--line);font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg button.in{background:var(--accent-soft);border-color:transparent}
.stepper{display:flex;align-items:center;gap:12px}
.stepper b{font-family:var(--f-mono);font-size:22px;min-width:76px;text-align:center}
.setgrid{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.setgrid select,.setgrid input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:15px}

/* tabbar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-inline:8px}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 11px;font-size:12px;font-weight:700;color:var(--muted)}
#tabs button svg{width:22px;height:22px}
#tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
#backdrop{position:fixed;inset:0;background:var(--scrim);z-index:40}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;justify-content:center;pointer-events:none}
#sheet .sh{pointer-events:auto;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding-inline:18px;padding-block:10px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .22s ease-out}
#sheet .sh.still{animation:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 0}
.shhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}

/* overlays (focus + low mode) */
#overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto}
.ov{max-width:440px;min-height:100%;margin:0 auto;padding-inline:20px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.ov main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;text-align:center;align-items:center}
.ov .h1{font-size:30px}
.ring{position:relative;width:236px;height:236px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .cd{position:absolute;inset:0;display:grid;place-items:center;font:500 52px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ov .btns{display:flex;flex-direction:column;gap:10px;width:100%}
.low{background:var(--soft)}
.low .h1{font-size:34px;line-height:1.15}
.bigcd{font:500 76px/1 var(--f-mono);font-variant-numeric:tabular-nums}

/* notification banner */
#notif{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;justify-content:center;padding-inline:12px;padding-top:calc(10px + env(safe-area-inset-top,0px));pointer-events:none}
.ncard{pointer-events:auto;width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:12px;animation:down .25s ease-out}
.ncard .hd{display:flex;gap:12px;align-items:flex-start}
.nico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.nico.med{background:var(--crit-soft);color:var(--crit)}
.nico svg{width:20px;height:20px}
@keyframes down{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14.5px;max-width:calc(100% - 32px);width:max-content;text-align:center}

/* charts */
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.hb{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:13.5px}
.hb .tr{height:10px;background:var(--soft);border-radius:5px;position:relative;overflow:hidden}
.hb .tr i{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--good)}
.hb .tr i.neg{background:var(--crit)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .v{font:700 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.delta{font-size:12.5px;font-weight:700}
.delta.up{color:var(--good)} .delta.down{color:var(--crit)}
.ins{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0;padding-top:4px}
.rec{display:flex;gap:8px;font-size:14.5px;color:var(--ink)}
.rec::before{content:"→";color:var(--accent);font-weight:700}
.claudeout{white-space:pre-wrap;font-size:15px;line-height:1.55}
.slots{display:flex;gap:8px}
.slot{flex:1;padding:8px;border-radius:10px;background:var(--soft);text-align:center;font-size:13px;font-weight:700;color:var(--muted)}
.slot.on{background:var(--good-soft);color:var(--good)}
.slot.cur{outline:2px solid var(--accent);outline-offset:-2px}
.medrow{display:flex;align-items:center;gap:12px}
.medrow .grow{flex:1;min-width:0}
.sectiontitle{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app" class="app"></div>
<nav id="tabs" aria-label="Secciones"></nav>
<div id="overlay" hidden></div>
<div id="backdrop" hidden></div>
<div id="sheet" hidden></div>
<div id="notif" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
'use strict';
/* ============ utilidades ============ */
const KEY='focus-tdah-v1';
const pad=n=>String(n).padStart(2,'0');
const ds=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ds();
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ds(d)};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const hm=m=>{m=Math.max(0,Math.round(m));return `${pad(Math.floor(m/60)%24)}:${pad(m%60)}`};
const toMin=s=>{const[a,b]=String(s).split(':').map(Number);return a*60+(b||0)};
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const f1=n=>(Math.round(n*10)/10).toFixed(1).replace('.',',');
const dur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return h?`${h} h${r?` ${r} min`:''}`:`${r} min`};
const roundUp5=m=>Math.ceil(m/5)*5;
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const longDate=s=>{const d=new Date(s+'T12:00:00');return `${cap(DOW[d.getDay()])} ${d.getDate()} de ${MON[d.getMonth()]}`};

const I={
 now:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg>',
 plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01" stroke-width="3"/></svg>',
 hoy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M8.5 13.5l2.5 2.5 4.5-5"/></svg>',
 pat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 5-7 4 4"/><path d="M3 21h18"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5z"/></svg>',

function breakdown(line){
  let raw=String(line).trim().replace(/^[-•*\d.)\s]+/,'');
  if(!raw) return [];
  const mh=raw.match(/(\d+(?:[.,]\d+)?)\s*(h|hs|horas?)\b/i), mm=raw.match(/(\d+)\s*(min|minutos)\b/i);
  const clean=raw.replace(/\(?\s*\d+(?:[.,]\d+)?\s*(h|hs|horas?|min|minutos)\b\)?/ig,'').replace(/\s+/g,' ').trim()||raw;
  const group=cap(clean.length>46?clean.slice(0,44)+'…':clean);
  const lc=clean.charAt(0).toLowerCase()+clean.slice(1);
  const vague=/\b(ver lo de|ocuparme|encargarme|organizar(me)?|algo|cosas|lo de|tema|resolver)\b/i.test(clean);
  const tpl=TEMPLATES.find(t=>t.re.test(clean));
  let steps;
  if(vague) steps=[[`Escribir en una línea qué significa "terminado" para: ${lc}`,10],[`Hacer la primera acción concreta de: ${lc}`,25],['Revisar qué falta y anotar el próximo paso',10]];
  else if(tpl) steps=tpl.steps.map(s=>s.slice());
  else if(clean.split(/\s+/).length<=3) steps=[[`Preparar lo necesario para ${lc}`,10],[cap(clean),20]];
  else steps=[[`Preparar lo necesario para ${lc}`,10],[`${cap(clean)}: primera parte`,25],[`${cap(clean)}: cerrar y revisar`,15]];
  const target=mh?parseFloat(mh[1].replace(',','.'))*60:mm?+mm[1]:0;
  if(target){
    let tot=steps.reduce((s,x)=>s+x[1],0);
    if(target>tot){let k=1;while(tot+10<=target&&k<8){const m=Math.min(25,Math.max(10,target-tot));steps.splice(steps.length-1,0,[`Seguir con ${lc} (bloque ${++k})`,m]);tot+=m}}
    else while(steps.length>1&&tot>target*1.3){tot-=steps.pop()[1]}
  }
  const cat=tpl?tpl.cat:detectCat(clean);
  return steps.map((s,i)=>({id:uid(),group,title:s[0],minutes:clamp(Math.round(s[1]/5)*5,10,30),cat,seq:i}));
}

}

/* ============ planificación ============ */
function postponeCount(g){return S.postponeLog.filter(p=>p.group===g||p.title===g).length}
function scoreGroup(g){
  let s=0; const t=g.toLowerCase();
  if(/urgente|hoy|vence|entregar|plazo|viernes|lunes|mañana|pagar|expensas|m[eé]dic|dentista|turno/.test(t)) s+=5;
  if(/informe|trabajo|cliente|proyecto|examen|presentaci|jefe/.test(t)) s+=3;
  s+=postponeCount(g)*1.2;
  const mins=S.tasks.filter(x=>x.group===g&&!x.done).reduce((a,x)=>a+x.minutes,0);
  if(mins&&mins<=20) s+=1;
  if(/practicar|bajo|leer|ordenar/.test(t)) s-=1;
  return s;
}
function prioritize(){
  const T=today(), d=day(T), all=tasksOn(T);
  const groups=[...new Set(all.map(t=>t.group))];
  let pr=(d.priorities||[]).filter(g=>groups.includes(g));
  const rest=groups.filter(g=>!pr.includes(g)&&all.some(t=>t.group===g&&!t.done)).sort((a,b)=>scoreGroup(b)-scoreGroup(a));
  while(pr.length<3&&rest.length) pr.push(rest.shift());
  d.priorities=pr;
}
function orderPending(list,prios){
  const pi=g=>{const i=prios.indexOf(g);return i<0?99:i}, sc={};
  list.forEach(t=>{if(!(t.group in sc))sc[t.group]=scoreGroup(t.group)});
  return list.slice().sort((a,b)=>(a.bump||0)-(b.bump||0)||pi(a.group)-pi(b.group)||sc[b.group]-sc[a.group]||(a.group<b.group?-1:a.group>b.group?1:0)||a.seq-b.seq);
}
function layout(list,from){
  let t=from,n=0; const L=toMin(S.settings.lunch);
  for(const k of list){
    if(t>=L&&t<L+45) t=L+45; else if(t<L&&t+k.minutes>L+10) t=L+45;
    k.start=t; t+=k.minutes; n++; t+=n%4===0?15:S.settings.shortBreak;
  }
  return t;
}
function computeLoad(list,from){
  const copy=list.map(t=>({...t})); const end=layout(copy,from);
  const need=list.length?end-from:0, available=Math.max(toMin(S.settings.dayEnd)-from,180);
  return {need,available,work:list.reduce((s,t)=>s+t.minutes,0),over:need>available,ratio:need/available};
}
function fitDay(ord,from,prios){
  const movedGroups=[];
  while(computeLoad(ord,from).over){
    const cands=[...new Set(ord.map(t=>t.group))].filter(g=>!prios.includes(g));
    if(!cands.length) break;
    cands.sort((a,b)=>scoreGroup(a)-scoreGroup(b));
    const g=cands[0]; movedGroups.push(g); ord=ord.filter(t=>t.group!==g);
  }
  return {keep:ord,movedGroups};
}
function planStart(){return Math.max(roundUp5(nowMin()),toMin(S.settings.dayStart))}
/* Reacomoda lo pendiente desde ahora. Si no entra, pasa a mañana lo menos importante. */
function replan(autoReorg=true,quiet=false){
  const T=today(), d=day(T); prioritize();
  let pend=pendingToday(), from=planStart();
  const run=S.timer&&S.timer.kind==='focus'&&!S.timer.finished?S.timer.taskId:null;
  if(run){pend=pend.filter(t=>t.id!==run);from=roundUp5(nowMin()+Math.ceil(Math.max(0,S.timer.endAt-Date.now())/60000))+S.settings.shortBreak}
  let ord=orderPending(pend,d.priorities), moved=[];
  if(autoReorg){const r=fitDay(ord,from,d.priorities);moved=r.movedGroups;ord=r.keep;
    if(moved.length){const tm=addDays(T,1);S.tasks.forEach(t=>{if(t.date===T&&!t.done&&moved.includes(t.group)){t.date=tm;t.start=null;t.autoMoved=true}})}}
  layout(ord,from); save();
  if(moved.length&&!quiet) toast(`Pasé a mañana: ${moved.join(', ')}. Hoy alcanza con lo que queda.`);
  return moved;
}
function rollover(){
  const T=today(); let n=0;
  S.tasks.forEach(t=>{if(!t.done&&t.date<T){t.date=T;t.start=null;t.bump=0;n++}});
  return n;
}

  if(!r.critical){

    if(U.low) return;                                                // modo baja concentración: solo medicación
    if(isCalm()&&!['agua','comida','pausa'].includes(r.type)) return; // día cargado: lo mínimo
    if(S.notifLog.filter(t=>Date.now()-t<3600e3).length>=S.settings.maxPerHour) return;
    S.notifLog.push(Date.now()); S.notifLog=S.notifLog.slice(-40); save();
  }
  showNotif(r);
}

let actx=null;
function chime(){
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    [660,880].forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(0.0001,actx.currentTime+i*0.18);g.gain.exponentialRampToValueAtTime(0.15,actx.currentTime+i*0.18+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+i*0.18+0.5);
      o.connect(g).connect(actx.destination);o.start(actx.currentTime+i*0.18);o.stop(actx.currentTime+i*0.18+0.55)});
  }catch(e){}
  try{navigator.vibrate&&navigator.vibrate([120,80,120])}catch(e){}
}

/* ============ hábitos ============ */
function habitLimit(){
  const c=lastCheckin(), m=S.settings.maxHabits;
  if(c&&(c.energy<=3||c.stress>=8)) return Math.max(1,m-2);
  if(c&&c.energy<=5) return Math.max(1,m-1);
  return m;
}
function habitPlanToday(){
  const T=today(), d=day(T), lim=habitLimit();
  if(!d.habitPlan){
    const since=k=>{for(let i=1;i<=7;i++){const x=S.days[addDays(T,-i)];if(x&&x.habits&&x.habits[k])return i}return 8};
    const lift=Object.fromEntries(habitLifts().map(h=>[h.k,h.lift]));
    d.habitPlan=HABITS.map(h=>h[0]).sort((a,b)=>(since(b)+(lift[b]||0)*3)-(since(a)+(lift[a]||0)*3)).slice(0,lim);
  }
  if(d.habitPlan.length>lim){const done=d.habitPlan.filter(k=>d.habits[k]);d.habitPlan=[...done,...d.habitPlan.filter(k=>!d.habits[k])].slice(0,Math.max(lim,done.length))}
  return d.habitPlan;
}

/* ============ análisis ============ */
function dayAvg(date){const cs=checkinsOn(date);if(!cs.length)return null;const o={};METRICS.forEach(([k])=>o[k]=avg(cs.map(c=>c[k])));return o}
const dayScore=a=>(a.focus+a.energy+a.mood+(11-a.anxiety)+(11-a.stress))/5;
function lastDates(n,offset=0){const T=today(),a=[];for(let i=n-1+offset;i>=offset;i--)a.push(addDays(T,-i));return a}
function pearson(x,y){const n=x.length;if(n<4)return 0;const mx=avg(x),my=avg(y);let a=0,b=0,c=0;for(let i=0;i<n;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return b&&c?a/Math.sqrt(b*c):0}
function habitLifts(){
  const ds=lastDates(28,1).filter(d=>S.days[d]&&dayAvg(d));
  return HABITS.map(([k,name])=>{
    const w=ds.filter(d=>S.days[d].habits&&S.days[d].habits[k]).map(d=>dayScore(dayAvg(d)));
    const wo=ds.filter(d=>!(S.days[d].habits&&S.days[d].habits[k])).map(d=>dayScore(dayAvg(d)));
    return {k,name,n:w.length,lift:w.length>=3&&wo.length>=3?avg(w)-avg(wo):0};
  }).sort((a,b)=>b.lift-a.lift);
}
function bestWindow(counts,lo=8,hi=21){let best=lo,bv=-1;for(let h=lo;h<hi;h++){const v=(counts[h]||0)+(counts[h+1]||0);if(v>bv){bv=v;best=h}}return {h:best,v:bv}}
function insights(){

    if(hi!=null&&lo!=null) out.push({k:'sueno',w:Math.abs(hi-lo),title:'Sueño y concentración',

      rec: hi-lo>0.8?'Antes de un día exigente, apuntá a 7 h: alarma para empezar a acostarte 8 h antes de levantarte.':'El sueño no parece ser tu factor principal. Mirá los hábitos.',chart:scatterSVG(pts)});
  }

  if(Object.keys(dh).length){const w=bestWindow(dh,8,21);const aft=avg(S.checkins.filter(c=>c.slot==='tarde'&&c.date>=addDays(today(),-28)).map(c=>c.focus)), mor=avg(S.checkins.filter(c=>c.slot==='mañana'&&c.date>=addDays(today(),-28)).map(c=>c.focus));
    out.push({k:'dificil',w:1.5,title:'Horario de mayor dificultad',

    rec:'En esa franja usá bloques de 15 min y tareas mecánicas: mails, pagos, ordenar.'});}
  // 4. tareas postergadas

  const top=Object.entries(pc).sort((a,b)=>b[1]-a[1]).filter(x=>x[1]>=2).slice(0,3);
  if(top.length){const bh=tot?bestWindow(byH).h:10;out.push({k:'posterga',w:top[0][1]*0.6,title:'Lo que más postergás',

  // 5. hábitos

    finding:`Los días que hacés "${b.name}" tu puntaje del día sube ${b.lift>=0?'+':''}${f1(b.lift)} puntos.${hl[1]&&hl[1].lift>0.3?` Le sigue "${hl[1].name}" (+${f1(hl[1].lift)}).`:''}`,
    rec:`Si hoy elegís un solo hábito, que sea ${b.name.toLowerCase()}.`,chart:liftHTML(hl)});}
  // 6. actividad física
  const wx=ds.filter(d=>S.days[d].exercise&&S.days[d].exercise.length&&dayAvg(d)), nx=ds.filter(d=>!(S.days[d].exercise&&S.days[d].exercise.length)&&dayAvg(d));
  if(wx.length>=3&&nx.length>=3){

    const r1=rate(wx),r0=rate(nx);

      finding:`Con actividad: energía ${f1(e1)} y concentración ${f1(f1v)}. Sin actividad: ${f1(e0)} y ${f1(f0)}.${r1!=null&&r0!=null?` Completás el ${Math.round(r1*100)}% de lo planeado contra ${Math.round(r0*100)}%.`:''}`,
      rec:'Una caminata de 20 min antes de la franja difícil de la tarde.'});
  }
  // 7. medicación
  const md=lastDates(14,1), taken=S.meds.filter(m=>md.includes(m.date));
  const late=taken.filter(m=>m.time===S.settings.medTimes[1]).map(m=>toMin(m.takenAt)-toMin(m.time));
  out.push({k:'med',w:1,title:'Medicación',

    rec:late.length&&avg(late)>15?`Dejá la pastilla de las ${S.settings.medTimes[1]} junto a lo que usás para almorzar, o adelantá el recordatorio 10 min. Cualquier cambio de horario o dosis, consultalo con tu médico.`:'Buen ritmo. Mantené la pastilla siempre en el mismo lugar.'});
  return out.sort((a,b)=>b.w-a.w);
}
function nightly(){

function scatterSVG(pts){
  const W=320,H=170,l=30,r=10,t=10,b=26,x=s=>l+(s-4)/5*(W-l-r),y=v=>t+(1-v/10)*(H-t-b);
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),mx=avg(xs),my=avg(ys);
  let num=0,den=0;pts.forEach(p=>{num+=(p[0]-mx)*(p[1]-my);den+=(p[0]-mx)**2});const sl=den?num/den:0,ic=my-sl*mx;
  let g='';[0,5,10].forEach(v=>g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  [4,5,6,7,8,9].forEach(s=>g+=`<text x="${x(s)}" y="${H-8}" text-anchor="middle">${s} h</text>`);
  g+=`<line x1="${x(4.5)}" y1="${y(clamp(sl*4.5+ic,0,10))}" x2="${x(8.8)}" y2="${y(clamp(sl*8.8+ic,0,10))}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/>`;
  pts.forEach(p=>g+=`<circle cx="${x(clamp(p[0],4,9))}" cy="${y(p[1])}" r="4" fill="var(--accent)" fill-opacity=".55"/>`);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Horas de sueño contra concentración">${g}</svg></div><p class="tiny muted">Cada punto es un día: horas de sueño (abajo) y concentración promedio (izquierda).</p>`;
}
function hoursSVG(byH){
  const W=320,H=140,l=8,r=8,t=10,b=24,hs=[];for(let h=8;h<=20;h++)hs.push(h);
  const mx=Math.max(...hs.map(h=>byH[h]||0),1),bw=(W-l-r)/hs.length;
  let g=`<line x1="${l}" x2="${W-r}" y1="${H-b}" y2="${H-b}" stroke="var(--line)"/>`;
  hs.forEach((h,i)=>{const v=byH[h]||0,hh=(H-t-b)*v/mx;g+=`<rect x="${l+i*bw+3}" y="${H-b-hh}" width="${bw-6}" height="${hh}" rx="3" fill="var(--accent)" fill-opacity="${v===mx?1:.45}"/>`;if(h%2===0)g+=`<text x="${l+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${h}</text>`});
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Minutos de foco por hora del día">${g}</svg></div><p class="tiny muted">Minutos de foco por hora del día, últimas 4 semanas.</p>`;

/* ============ overlays: foco y baja concentración ============ */
const ov=document.getElementById('overlay');
function renderOverlay(){
  if(U.low){ov.hidden=false;ov.innerHTML=vLow();return}
  if(U.overlay==='focus'&&S.timer){const h=vFocus();if(h){ov.hidden=false;ov.innerHTML=h;updateCountdown();return}}
  ov.hidden=true;ov.innerHTML='';
}
function ringSVG(){const C=2*Math.PI*104;return `<svg viewBox="0 0 236 236" aria-hidden="true"><circle cx="118" cy="118" r="104" fill="none" stroke="var(--line)" stroke-width="12"/><circle id="ringFg" cx="118" cy="118" r="104" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg>`}
function vFocus(){
  const tm=S.timer, t=taskById(tm.taskId);
  if(tm.kind==='break'){
    const nx=nextTask();
    if(tm.finished) return `<div class="ov"><header class="between"><span class="eyebrow">Descanso terminado</span><button class="iconbtn" data-a="fExit" aria-label="Cerrar">${I.x}</button></header><main><p class="muted">Siguiente paso</p><h1 class="h1">${nx?esc(nx.title):'No queda nada pendiente'}</h1>${nx?`<p class="muted">${esc(nx.group)} · ${nx.minutes} min</p>`:''}</main><div class="btns">${nx?`<button class="btn primary big" data-a="start" data-id="${nx.id}">${I.play} Empezar</button>`:''}<button class="btn ghost" data-a="fExit">Ahora no</button></div></div>`;
    return `<div class="ov"><header class="between"><span class="eyebrow">Descanso</span><button class="iconbtn" data-a="fExit" aria-label="Cerrar">${I.x}</button></header><main><h1 class="h1">Levantate, tomá agua, mirá lejos.</h1><div class="ring">${ringSVG()}<div class="cd" id="cd">--:--</div></div>${nx?`<p class="muted">Después: ${esc(nx.title)}</p>`:''}</main><div class="btns"><button class="btn" data-a="breakSkip">Saltar descanso</button></div></div>`;
  }
  if(!t){S.timer=null;U.overlay=null;return ''}
  const st=groupSteps(t), idx=st.findIndex(x=>x.id===t.id)+1;
  if(tm.finished) return `<div class="ov"><header class="between"><span class="eyebrow">Bloque terminado</span></header><main><p class="muted">${esc(t.group)}</p><h1 class="h1">¿Terminaste “${esc(t.title)}”?</h1></main><div class="btns"><button class="btn primary big" data-a="fComplete">Sí, terminado</button><button class="btn" data-a="fMore">Necesito 10 minutos más</button><button class="btn ghost" data-a="fLater">Lo sigo más tarde</button></div></div>`;
  return `<div class="ov"><header class="between"><span class="eyebrow">Foco · paso ${idx} de ${st.length}</span><button class="btn sm ghost" data-a="fExit">Salir</button></header>
   <main><p class="muted">${esc(t.group)}</p><h1 class="h1">${esc(t.title)}</h1><div class="ring">${ringSVG()}<div class="cd" id="cd">--:--</div></div>
   ${U.distract?`<div class="card" style="width:100%;text-align:left"><p class="h3">Pasa. ¿Qué hacemos?</p><button class="btn primary" data-a="dBack">Volver al bloque</button><button class="btn" data-a="low">Paso más chico (modo baja concentración)</button><button class="btn ghost" data-a="dBreak">Pausa de 5 minutos</button></div>`:''}
   </main>
   <div class="btns"><div class="row">${tm.paused?'<button class="btn" data-a="fResume">Seguir</button>':'<button class="btn" data-a="fPause">Pausa</button>'}<button class="btn primary" data-a="fDoneEarly">Terminé</button></div>${U.distract?'':'<button class="btn ghost" data-a="fDistract">Me distraje</button>'}</div></div>`;
}
function vLow(){
  const L=U.low, t=taskById(L.taskId);
  if(!t) return `<div class="ov low"><header class="between"><span class="eyebrow">Baja concentración</span><button class="btn sm ghost" data-a="lowExit">Salir</button></header><main><h1 class="h1">No queda nada pendiente.</h1><p class="muted">Podés descansar.</p></main></div>`;
  const steps=tinySteps(t), step=steps[L.i];
  const head=`<header class="between"><span class="eyebrow">Baja concentración</span><button class="btn sm ghost" data-a="lowExit">Salir</button></header>`;
  if(L.phase==='run'){
    return `<div class="ov low">${head}<main><h1 class="h1">${esc(step)}</h1><div class="bigcd" id="cd">--:--</div></main><div class="btns"><button class="btn primary big" data-a="lowDone">Listo</button></div></div>`;
  }
  if(L.phase==='ask') return `<div class="ov low">${head}<main><h1 class="h1">¿Terminaste “${esc(t.title)}”?</h1></main><div class="btns"><button class="btn primary big" data-a="lowYes">Sí</button><button class="btn" data-a="lowNo">Todavía no: 5 minutos más</button></div></div>`;
  return `<div class="ov low">${head}<main>${L.phase==='next'?'<p class="pill good">Bien. Siguiente paso</p>':'<p class="muted">Solo esto:</p>'}<h1 class="h1">${esc(step)}</h1>
    <div class="chips" style="justify-content:center">${[2,5,10].map(m=>`<button class="chip ${L.min===m?'on':''}" data-a="lowMin" data-m="${m}">${m} min</button>`).join('')}</div></main>
    <div class="btns"><button class="btn primary big" data-a="lowStart">${I.play} Empezar ${L.min} min</button></div></div>`;
}
function updateCountdown(){
  const tm=S&&S.timer, el=document.getElementById('cd'); if(!tm||!el) return;
  const left=tm.paused?tm.left:Math.max(0,tm.endAt-Date.now()), s=Math.ceil(left/1000);
  el.textContent=`${pad(Math.floor(s/60))}:${pad(s%60)}`;
  const fg=document.getElementById('ringFg'); if(fg){const C=2*Math.PI*104;fg.setAttribute('stroke-dashoffset',String(C*(1-left/(tm.dur*1000))))}
}
function startFocus(id){
  const t=taskById(id); if(!t) return;
  S.timer={kind:'focus',taskId:id,startedAt:Date.now(),endAt:Date.now()+t.minutes*60e3,dur:t.minutes*60,paused:false,finished:false};
  t.start=nowMin(); U.overlay='focus'; U.distract=false; U.low=null;
  replan(false); closeSheet(); render();
}
function logFocus(t,mins){if(mins<3)return;S.focusLog.push({date:today(),hour:new Date(S.timer.startedAt).getHours(),min:Math.round(mins)})}
function completeTask(t){t.done=true;t.doneAt=hm(nowMin());day().pomodoros++}
function startBreak(){
  const n=day().pomodoros, m=n%4===0?15:S.settings.shortBreak;
  S.timer={kind:'break',startedAt:Date.now(),endAt:Date.now()+m*60e3,dur:m*60,paused:false,finished:false};U.overlay='focus';
}

/* ============ notificación en pantalla ============ */
const nEl=document.getElementById('notif');
function showNotif(r){
  U.notif=r; chime();
  const acts={med:[['yes','Tomado'],['later',`Recordar en ${S.settings.snooze} min`]],agua:[['yes','Tomé agua'],['no','Ahora no']],comida:[['yes','Ya comí'],['later','En 30 min']],checkin:[['yes','Hacer check-in'],['later','Más tarde']],tarea:[['yes','Empezar'],['later','Más tarde']],ejercicio:[['yes','Registrar'],['later','Más tarde']],habitos:[['yes','Ver hábitos'],['no','Hoy no']]}[r.type]||[['yes','Hecho'],['later','Más tarde']];
  sysNotify(r,acts);
  nEl.hidden=false;
  nEl.innerHTML=`<div class="ncard" role="alertdialog" aria-labelledby="nt"><div class="hd"><span class="nico ${r.type==='med'?'med':''}">${r.type==='med'?I.pill:I.bell}</span><div><p class="h3" id="nt">${esc(r.title)}</p><p class="small muted">${esc(r.body)}</p></div></div><div class="row">${acts.map(([k,l],i)=>`<button class="btn sm ${i===0?'primary':''}" data-a="nAct" data-k="${k}">${l}</button>`).join('')}</div></div>`;
}
/* Notificación del sistema (Android): aparece en la barra aunque la app esté en segundo plano */
let swReg=null;
async function sysNotify(r,acts){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted') return;
    const reg=swReg||(navigator.serviceWorker&&await navigator.serviceWorker.ready);
    if(!reg) return;
    await reg.showNotification(r.title,{body:r.body,tag:'focus-'+r.id,renotify:true,requireInteraction:!!r.critical,
      icon:'icon-192.png',badge:'icon-192.png',vibrate:[120,80,120],
      actions:acts.slice(0,2).map(([k,l])=>({action:k,title:l})),data:{id:r.id}});
  }catch(e){}
}
async function closeSysNotif(id){try{const reg=swReg||(navigator.serviceWorker&&await navigator.serviceWorker.ready);if(!reg)return;(await reg.getNotifications({tag:'focus-'+id})).forEach(n=>n.close())}catch(e){}}
function hideNotif(){if(U.notif)closeSysNotif(U.notif.id);U.notif=null;nEl.hidden=true;nEl.innerHTML='';setTimeout(reminderTick,1200)}
function nAct(k){
  const r=U.notif, d=day(); if(!r) return;
  if(r.type==='med'){
    if(k==='yes'){ if(!r.test) S.meds.push({date:today(),time:r.slot,takenAt:hm(nowMin())}); toast(r.test?'Prueba: así se registra la toma.':`Registrado: ${hm(nowMin())}`); if(!r.test) delete d.handled[r.id]; }
    else { if(!r.test) d.handled[r.id]={snooze:nowMin()+S.settings.snooze}; toast(`Te lo recuerdo a las ${hm(nowMin()+S.settings.snooze)}.`); }
  } else {
    if(k==='later'){ if(!r.test) d.handled[r.id]={snooze:nowMin()+30}; }
    else { if(!r.test) d.handled[r.id]={done:true};
      if(k==='yes'){
        if(r.type==='agua') d.water++;
        if(r.type==='comida') d.meals[r.meal]=true;
        if(r.type==='checkin') {save();hideNotif();openCheckin();return}
        if(r.type==='tarea'){const t=nextTask();save();hideNotif();if(t)startFocus(t.id);return}
        if(r.type==='ejercicio'){save();hideNotif();openEx();return}
        if(r.type==='habitos'){S.ui.tab='hoy'}
      }
    }
  }
  save(); hideNotif(); render();
}

/* --- planificación de la mañana --- */
function openPlan(){U.plan={step:1,text:'',drafts:[],prios:[],moved:[],claude:null};renderPlanFlow()}
function renderPlanFlow(){
  const P=U.plan; if(!P) return; let h='';
  if(P.step===1){
    const pend=pendingToday().length;
    h=`${shHead('¿Qué tenés que hacer?','Escribí en desorden, una cosa por línea. Puede ser vago.')}

    <div class="chips">${['Ver lo del auto','Terminar informe del cliente 2h','Preparar comidas de la semana','Estudiar para el parcial','Pagar el monotributo'].map(x=>`<button class="chip" data-a="planEx" data-v="${esc(x)}">+ ${esc(x)}</button>`).join('')}</div>
    ${pend?`<p class="small muted">Ya tenés ${pend} pasos pendientes hoy: se suman al plan.</p>`:''}
    <button class="btn primary" data-a="planNext">Convertir en acciones</button>`;
  } else if(P.step===2){
    const groups=[...new Set(P.drafts.map(x=>x.group))], tot=P.drafts.reduce((s,x)=>s+x.minutes,0);
    h=`${shHead('Así lo convertí en acciones',`${P.drafts.length} pasos de 10 a 30 min · ${dur(tot)}`)}
    ${groups.map(g=>`<div class="card" style="gap:4px"><p class="h3">${esc(g)}</p><div class="list">${P.drafts.filter(x=>x.group===g).map(x=>`<div class="item"><div class="grow"><p class="small">${esc(x.title)}</p></div><button class="chip num" data-a="dMin" data-id="${x.id}" aria-label="Cambiar duración">${x.minutes}′</button><button class="iconbtn" style="width:34px;height:34px" data-a="dDel" data-id="${x.id}" aria-label="Quitar">${I.x}</button></div>`).join('')}</div></div>`).join('')}
    ${sample?`<button class="btn soft" data-a="planClaude" ${P.claude==='loading'?'disabled':''}>${P.claude==='loading'?'Claude está afinando los pasos…':P.claude==='done'?'Afinado con Claude ✓ (otra vez)':'Afinar los pasos con Claude'}</button>${P.claude==='err'?'<p class="tiny muted">No pude conectar con Claude. Los pasos de arriba funcionan igual.</p>':''}`:''}
    <div class="row"><button class="btn" data-a="planBack">Atrás</button><button class="btn primary" data-a="planNext" ${P.drafts.length?'':'disabled'}>Siguiente</button></div>`;
  } else if(P.step===3){
    const groups=[...new Set([...pendingToday().map(t=>t.group),...P.drafts.map(x=>x.group)])];
    h=`${shHead('Tus 3 prioridades','Las elegí por urgencia, importancia y cuánto vienen postergándose. Tocá para cambiar.')}
    <div class="list">${groups.map(g=>{const i=P.prios.indexOf(g);return `<button class="item" data-a="pPrio" data-g="${esc(g)}"><span class="check ${i>=0?'on':''}">${i>=0?`<b style="font-size:13px">${i+1}</b>`:''}</span><div class="grow"><p class="t">${esc(g)}</p>${postponeCount(g)?`<p class="s">Pospuesta ${postponeCount(g)} ${postponeCount(g)===1?'vez':'veces'}: hoy le toca</p>`:''}</div></button>`}).join('')}</div>
    <div class="row"><button class="btn" data-a="planBack">Atrás</button><button class="btn primary" data-a="planNext" ${P.prios.length?'':'disabled'}>Ver mi día</button></div>`;
  } else {
    const all=[...pendingToday(),...P.drafts.map(x=>({...x}))], from=planStart();
    let ord=orderPending(all,P.prios); const L=computeLoad(ord,from);
    const fit=fitDay(ord,from,P.prios); P.suggest=fit.movedGroups;
    const show=P.apply?fit.keep:ord; const prev=show.map(t=>({...t})); layout(prev,from);
    const L2=computeLoad(show,from);
    h=`${shHead('Tu día',`Desde las ${hm(from)} · bloques con pausas de ${S.settings.shortBreak} min`)}
    <div class="bar ${L2.over?'over':''}"><i style="width:${Math.min(100,Math.round(L2.ratio*100))}%"></i></div>
    ${L.over&&!P.apply?`<div class="note"><span>Hay ${dur(L.need)} de trabajo y descansos para ${dur(L.available)} disponibles. Te propongo pasar a mañana: <b>${esc(fit.movedGroups.join(', ')||'nada')}</b>.</span></div><div class="row"><button class="btn soft" data-a="pApply">Aplicar propuesta</button><button class="btn ghost" data-a="pKeep">Mantener todo</button></div>`:''}
    ${P.apply&&fit.movedGroups.length?`<div class="note good"><span>Pasa a mañana: ${esc(fit.movedGroups.join(', '))}. Hoy entra.</span></div>`:''}
    <div class="list">${prev.slice(0,8).map(t=>`<div class="item"><span class="time">${hm(t.start)}</span><div class="grow"><p class="small"><b>${esc(t.title)}</b></p><p class="s">${P.prios.includes(t.group)?'★ ':''}${esc(t.group)} · ${t.minutes} min</p></div></div>`).join('')}${prev.length>8?`<p class="small muted" style="padding-top:8px">y ${prev.length-8} pasos más</p>`:''}</div>
    <div class="row"><button class="btn" data-a="planBack">Atrás</button><button class="btn primary" data-a="planConfirm">Confirmar plan</button></div>`;
  }
  openSheet(h);
}
async function planClaude(){
  const P=U.plan; if(!P||!sample) return; P.claude='loading'; renderPlanFlow();
  const lines=P.text.split('\n').map(x=>x.trim()).filter(Boolean);
  const prompt=`Sos un asistente para un adulto con TDAH. Convertí cada tarea en microtareas concretas y físicas de 10 a 30 minutos, cada una empezando con un verbo en infinitivo, en español rioplatense, máximo 6 por tarea. Si la tarea es vaga, la primera microtarea debe aclarar qué significa "terminado". Respondé SOLO un JSON array de objetos {"group": nombre corto de la tarea original (máx 6 palabras), "title": microtarea, "minutes": número entre 10 y 30}.\nEjemplo: [{"group":"Ver lo del auto","title":"Buscar la fecha de vencimiento de la VTV","minutes":10}]\nTareas:\n${lines.map(l=>'- '+l).join('\n')}`;
  try{
    const arr=await sample.json(prompt,{modelTier:'default'});
    if(!Array.isArray(arr)||!arr.length) throw {code:'invalid_json'};
    const seqs={};
    P.drafts=arr.filter(x=>x&&x.title).slice(0,40).map(x=>{const g=cap(String(x.group||'Tarea').slice(0,48));seqs[g]=(seqs[g]||0);return {id:uid(),group:g,title:cap(String(x.title).slice(0,140)),minutes:clamp(Math.round((+x.minutes||20)/5)*5,10,30),cat:detectCat(g+' '+x.title),seq:seqs[g]++}});
    P.claude='done';
  }catch(e){P.claude=e&&(e.code==='not_granted'||e.code==='sampling_disabled')?null:'err'; if(e&&e.code==='not_granted') sample=null;}
  if(U.plan===P) renderPlanFlow();
}
function planConfirm(){
  const P=U.plan, T=today(), d=day(T);
  P.drafts.forEach(x=>S.tasks.push({...x,date:T,done:false,start:null}));
  d.priorities=P.prios.slice(0,3);
  if(P.apply&&P.suggest&&P.suggest.length){const tm=addDays(T,1);S.tasks.forEach(t=>{if(t.date===T&&!t.done&&P.suggest.includes(t.group)){t.date=tm;t.start=null;t.autoMoved=true}})}
  d.planned=true; replan(false); closeSheet(); S.ui.tab='ahora'; render();
  const t=nextTask(); toast(t?`Listo. Tu primer paso: ${t.title}`:'Plan listo.');
}

  exOpen:()=>openEx(),
  exSet:el=>{U.ex[el.dataset.f]=el.dataset.f==='min'?+el.dataset.v:el.dataset.v;renderEx()},
  exSave:()=>{day().exercise.push({type:U.ex.type,min:U.ex.min,intensity:U.ex.int,time:hm(nowMin())});save();closeSheet();render();toast('Actividad registrada.')},
  nAct:el=>nAct(el.dataset.k),
  testMed:()=>{closeSheet();showNotif({id:'test',type:'med',slot:S.settings.medTimes[0],title:`${S.settings.medName} · ${S.settings.medTimes[0]}`,body:'¿Ya la tomaste? (prueba)',critical:true,test:true})},
  testWater:()=>{closeSheet();showNotif({id:'test',type:'agua',title:'Hidratación',body:'Un vaso de agua. Nada más. (prueba)',test:true})},
  resetDemo:()=>{S=null;S=seed();save();closeSheet();U.low=null;U.overlay=null;render();toast('Datos de ejemplo restaurados.')},
  wipe:()=>{if(!U.wipeArm){U.wipeArm=true;openSettings();return}S=emptyState();save();closeSheet();U.low=null;U.overlay=null;render();toast('Borrado. Empezá planificando tu día.')},
  notifOn:async()=>{try{const p=await Notification.requestPermission();toast(p==='granted'?'Listo: vas a ver los avisos en la barra de Android.':'Sin permiso: los avisos se ven solo dentro de la app.')}catch(e){}openSettings()},
  exportData:()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`focus-tdah-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Copia guardada en Descargas.')},
  importData:()=>document.getElementById('importFile').click(),
  cwGo:el=>weeklyClaude(!!el.dataset.fresh),
  cwStop:()=>{if(cwCtl)cwCtl.abort()},
};
function lowAdvance(){
  const L=U.low; S.timer=null;
  const t=taskById(L.taskId), steps=t?tinySteps(t):[];
  if(L.i<steps.length-1){L.i++;L.phase='next';L.min=L.i===1?5:2}
  else L.phase='ask';
  save(); render();
}

/* --- análisis con Claude --- */
let cwCtl=null;
async function weeklyClaude(fresh){
  if(!sample) return;
  const ds=lastDates(14,1).filter(d=>S.days[d]);
  const rows=ds.map(d=>{const a=dayAvg(d)||{},x=S.days[d];return {fecha:d,sueño:x.sleep,conc:a.focus&&+a.focus.toFixed(1),energia:a.energy&&+a.energy.toFixed(1),ansiedad:a.anxiety&&+a.anxiety.toFixed(1),estres:a.stress&&+a.stress.toFixed(1),animo:a.mood&&+a.mood.toFixed(1),ejercicio:(x.exercise||[]).map(e=>e.type+' '+e.min+'m').join(',')||'no',habitos:Object.keys(x.habits||{}).filter(k=>x.habits[k]).join(','),tareas:`${x.done||0}/${x.planned||0}`,meds:S.settings.medTimes.map(t=>{const m=medTaken(d,t);return m?m.takenAt:'-'}).join(' ')}});
  const byH={};S.focusLog.filter(f=>ds.includes(f.date)).forEach(f=>byH[f.hour]=(byH[f.hour]||0)+f.min);
  const pp={};S.postponeLog.forEach(p=>pp[p.title]=(pp[p.title]||0)+1);
  const prompt=`Sos un coach de funciones ejecutivas para un adulto con TDAH. Analizá estos datos de 14 días (check-ins 1–10 promediados por día). Escribí en español rioplatense, tono cálido y directo, sin juzgar, texto plano sin markdown:\n1) "Patrones" con 3 viñetas que empiecen con "- " y citen números concretos.\n2) "Para esta semana" con 3 acciones concretas, con horario o duración.\nMáximo 170 palabras. No des indicaciones sobre dosis ni horarios de medicación; si algo de la medicación llama la atención, sugerí hablarlo con el médico.\nDías: ${JSON.stringify(rows)}\nMinutos de foco por hora: ${JSON.stringify(byH)}\nTareas postergadas (veces): ${JSON.stringify(pp)}`;
  cwCtl=new AbortController(); U.cw={state:'loading',text:''}; render();
  try{
    const res=await sample(prompt,{signal:cwCtl.signal,cache:fresh?false:{gcTime:3600e3},onText:({text})=>{U.cw.text=text;const el=document.getElementById('cw');if(el)el.textContent=text}});
    U.cw={state:'done',text:res.text};
  }catch(e){
    if(e&&e.code==='not_granted'){sample=null;U.cw={state:'idle',text:''}}
    else U.cw={state:e&&e.code==='cancelled'?'done':'err',text:(e&&e.text)||(e&&e.code==='cancelled'?'Detenido.':e&&e.code==='rate_limited'?'Muchos pedidos seguidos. Probá en un rato.':'No pude completar el análisis. Probá de nuevo más tarde.')};
  }
  render();
}

/* ============ eventos ============ */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a; if(A[a]){e.preventDefault();A[a](el,e)}
});
bd.addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sheet)closeSheet()});
document.addEventListener('submit',e=>{
  if(e.target.id!=='quickAdd') return; e.preventDefault();
  const inp=document.getElementById('qa'), v=inp.value.trim(); if(!v) return;
  const parts=breakdown(v); parts.forEach(t=>S.tasks.push({...t,date:today(),done:false,start:null}));
  replan(true,true); render(); toast(parts.length>1?`Lo dividí en ${parts.length} pasos de 10 a 30 min.`:'Agregada.');
});
document.addEventListener('change',e=>{
  if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;f.text().then(txt=>{const d=JSON.parse(txt);if(!d||d.v!==1||!Array.isArray(d.tasks))throw 0;S=d;S.settings={...DEFAULTS,...S.settings};save();closeSheet();render();toast('Copia recuperada.')}).catch(()=>toast('Ese archivo no es una copia de Focus TDAH.'));return}
  const k=e.target.dataset&&e.target.dataset.set; if(!k) return; const v=e.target.value, s=S.settings;
  if(k==='med0'||k==='med1'){if(v)s.medTimes[+k.slice(3)]=v}
  else if(['snooze','shortBreak','maxHabits','maxPerHour'].includes(k)) s[k]=+v;
  else if(v) s[k]=v;
  if(k==='maxHabits'){const d=day();d.habitPlan=null}
  if(['shortBreak','dayStart','dayEnd','lunch'].includes(k)) replan(false);
  save(); render(); toast('Ajuste guardado.');
});
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)U.open[k]=e.target.open},true);

/* ============ relojes ============ */
setInterval(()=>{
  const tm=S&&S.timer;
  if(tm&&!tm.paused&&!tm.finished&&Date.now()>=tm.endAt){
    chime();
    if(tm.kind==='tiny'){lowAdvance();return}
    tm.finished=true; save(); render(); return;
  }
  updateCountdown();
},1000);
let lastMin=nowMin(), lastDay=today();
setInterval(()=>{
  if(today()!==lastDay){lastDay=today();rollover();replan(true,true);render()}
  if(nowMin()!==lastMin){lastMin=nowMin();if(!U.sheet&&!ov.innerHTML&&S.ui.tab==='ahora')render()}
  reminderTick();
},20000);

/* ============ arranque ============ */
(function boot(){
  S=load();
  if(!S||S.v!==1){S=seed();save()}
  S.settings={...DEFAULTS,...S.settings}; S.ui=S.ui||{tab:'ahora'};
  if(location.hash==='#plan'){S.ui.tab='plan';setTimeout(()=>{history.replaceState(null,'',location.pathname);openPlan()},300)}
  const rolled=rollover();
  if(S.timer){ if(S.timer.kind==='tiny') S.timer=null; else U.overlay='focus'; }
  // reacomodo automático si el plan quedó atrás
  const p=pendingToday(), n=nowMin();
  const stale=p.some(t=>t.start==null)||p.some(t=>t.start!=null&&t.start+t.minutes<n-15);
  if(p.length&&(stale||rolled)&&!(S.timer&&S.timer.kind==='focus')){
    const moved=replan(true,true);
    setTimeout(()=>toast(rolled?`Traje ${rolled} pendientes de ayer y reacomodé el plan.`:moved.length?`Reacomodé tu plan desde ahora y pasé a mañana: ${moved.join(', ')}.`:'Reacomodé tu plan desde ahora.'),600);
  }
  save(); render();
  setTimeout(reminderTick,1800);
  (async()=>{try{if(window.claude&&window.claude.use){const s=await window.claude.use('sample');if(s){sample=s;render()}}}catch(e){}})();
})();

/* ============ app instalable (PWA) ============ */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{});
  // botones de la notificación de Android → misma acción que en la app
  navigator.serviceWorker.addEventListener('message',e=>{
    const m=e.data||{}; if(m.type!=='notif-action') return;
    if(m.action!=='open'&&U.notif&&U.notif.id===m.id) nAct(m.action);
  });
}
// al volver a la app: refrescar la hora, el plan y revisar recordatorios pendientes
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!S) return;
  if(today()!==lastDay){lastDay=today();rollover();replan(true,true)}
  if(!U.sheet) render(); updateCountdown(); reminderTick();
});
</script>
